name: InvCon+ CI

on:
  push:
    branches: ["main", "reproduction/invconplus"]
  pull_request:
    branches: ["main"]

jobs:
  L1-docker-build:
    name: L1 Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build Docker image
        run: docker build -t invconplus:ci .

  L2-dependency-check:
    name: L2 Dependency Check
    runs-on: ubuntu-latest
    needs: L1-docker-build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build Docker image
        run: docker build -t invconplus:ci .
      - name: Check key imports
        run: |
          docker run --rm invconplus:ci python3 -c "
          import slither
          import web3
          import evm_trace
          import z3
          import invconplus
          print('All key imports successful')
          "

  L3-smoke-test:
    name: L3 Smoke Test (requires archive RPC + chifra)
    runs-on: ubuntu-latest
    needs: L2-dependency-check
    steps:
      - name: Document reproducibility barriers
        run: |
          echo "L3 smoke test cannot run in CI due to two barriers:"
          echo ""
          echo "1. trace_replayTransaction requires a paid archive RPC node."
          echo "   Free providers (Dwellir, Ankr) do not support this method."
          echo "   Verified empirically: Dwellir returns 'plan does not support trace or debug methods'."
          echo ""
          echo "2. TrueBlocks/chifra requires 60-80GB blockchain index (chifra init --all)."
          echo "   This is not feasible in a CI runner environment."
          echo "   chifra also does not support Windows."
          echo ""
          echo "Full reproduction runs are performed manually on the repairnator server"
          echo "where chifra is installed and a Dwellir archive endpoint is configured."

  L4-dockerfile-lint:
    name: L4 Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf
        with:
          dockerfile: Dockerfile
