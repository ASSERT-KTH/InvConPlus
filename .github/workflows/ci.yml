name: InvCon+ CI

on:
  push:
    branches: ["main", "reproduction/invconplus"]
  pull_request:
    branches: ["main"]

jobs:
  L1-docker-build:
    name: L1 Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build Docker image
        run: docker build -t invconplus:ci .

  L2-dependency-check:
    name: L2 Dependency Check
    runs-on: ubuntu-latest
    needs: L1-docker-build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build Docker image
        run: docker build -t invconplus:ci .
      - name: Check key imports
        run: |
          docker run --rm invconplus:ci python3 -c "
          import slither
          import web3
          import evm_trace
          import z3
          import invconplus
          print('All key imports successful')
          "

  L3-smoke-test:
    name: L3 Smoke Test (skipped - requires archive RPC)
    runs-on: ubuntu-latest
    needs: L2-dependency-check
    steps:
      - name: Document RPC barrier
        run: |
          echo "L3 smoke test requires trace_replayTransaction (archive node RPC)"
          echo "This method is unavailable on free-tier providers (Dwellir, Ankr)."
          echo "Set RPC_URL secret with a trace-enabled archive endpoint to enable."

  L4-dockerfile-lint:
    name: L4 Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf
        with:
          dockerfile: Dockerfile
