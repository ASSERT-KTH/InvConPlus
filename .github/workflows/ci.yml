name: InvCon+ CI

on:
  push:
    branches: ["main", "reproduction/invconplus"]
  pull_request:
    branches: ["main"]

jobs:
  L1-docker-build:
    name: L1 Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build Docker image
        run: docker build -t invconplus:ci .

  L2-dependency-check:
    name: L2 Dependency Check
    runs-on: ubuntu-latest
    needs: L1-docker-build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build Docker image
        run: docker build -t invconplus:ci .
      - name: Check key imports
        run: |
          docker run --rm invconplus:ci python3 -c "
          import slither
          import web3
          import evm_trace
          import z3
          import invconplus
          print('All key imports successful')
          "

  L3-smoke-test:
    name: L3 Smoke Test
    runs-on: ubuntu-latest
    needs: L2-dependency-check
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build Docker image
        run: docker build -t invconplus:ci .
      - name: Run smoke test with cached data
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          docker run --rm \
            -e RPC_URL \
            -e ETHERSCAN_API_KEY \
            invconplus:ci \
            python3 -m invconplus.main \
              --address 0x22d982a8B875Cc0f8994cd8a4a70872161fdc000 \
              --maxCount 10

  L4-dockerfile-lint:
    name: L4 Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf
        with:
          dockerfile: Dockerfile
